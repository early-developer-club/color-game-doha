<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>절대색감 게임</title>
    <meta name="description" content="미세한 색상 차이를 구별하는 웹 게임입니다. 60초 내에 최대한 많은 레벨을 클리어해보세요!">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.svg">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="apple-touch-icon.svg">
    
    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="절대색감">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="절대색감 게임">
    <meta property="og:description" content="미세한 색상 차이를 구별하는 웹 게임입니다.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="icon.svg">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="절대색감 게임">
    <meta name="twitter:description" content="미세한 색상 차이를 구별하는 웹 게임입니다.">
    <meta name="twitter:image" content="icon.svg">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">절대색감</h1>
            <div class="timer-container">
                <div class="timer-bar">
                    <div class="timer-fill"></div>
                </div>
                <div class="timer-text">60초</div>
            </div>
        </header>

        <div class="start-screen" id="startScreen">
            <div class="start-content">
                <h2>게임을 시작해보세요!</h2>
                <p>미세한 색상 차이를 구별하는 게임입니다</p>
                <div class="nickname-input">
                    <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" maxlength="10">
                </div>
                <button class="start-btn" onclick="startGameWithNickname()">게임 시작</button>
            </div>
        </div>

        <main class="game-area" id="gameArea" style="display: none;">
            <div class="countdown" id="countdown">3</div>
            <div class="score">Level: <span id="level">1</span></div>
            <div class="game-grid" id="gameGrid"></div>
            <div class="message" id="message"></div>
        </main>

        <div class="game-over" id="gameOver" style="display: none;">
            <h2>게임 종료!</h2>
            <p class="player-name">플레이어: <span id="playerName">-</span></p>
            <p class="final-score">Level: <span id="finalLevel">0</span></p>
            <button class="restart-btn" onclick="restartGame()">다시 시작</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
